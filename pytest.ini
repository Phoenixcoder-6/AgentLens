[pytest]
# Disable the langsmith pytest plugin — AgentLens uses its own capture layer.
# This also avoids the uuid_utils DLL error on Windows with Application Control.
addopts = -p no:langsmith --tb=short -q
testpaths = tests

markers =
    integration: marks tests that make real LLM API calls (deselect with -m "not integration")
    slow: marks tests that take more than 5 seconds
