name: AgentLens CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff mypy types-PyYAML pydantic>=2.7.0

      - name: Ruff — lint
        run: ruff check .

      - name: Ruff — format check
        run: ruff format --check .

      - name: Mypy — type check
        run: mypy . --ignore-missing-imports --exclude '(_patch_|_diag_|check_|\.venv|alembic)'

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=analyzers \
            --cov=storage \
            --cov=normalizer \
            --cov=capture \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  labeled-set:
    name: Labeled Set Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Generate labeled set
        run: python scripts/generate_labeled_set.py

      - name: Verify labels.json exists and has 20 runs
        run: |
          python -c "
          import json
          with open('sample_data/labels.json') as f:
              data = json.load(f)
          assert data['total'] == 20, f'Expected 20 runs, got {data[\"total\"]}'
          print(f'  OK: {data[\"total\"]} labeled runs verified')
          print(f'  Categories: {data[\"category_counts\"]}')
          "
