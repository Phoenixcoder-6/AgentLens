name: AgentLens CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff mypy types-PyYAML pydantic>=2.7.0

      - name: Ruff — lint
        run: ruff check .

      - name: Ruff — format check
        run: ruff format --check .

      - name: Mypy — type check
        run: mypy . --ignore-missing-imports --exclude '(_patch_|_diag_|check_|\.venv|alembic)'

  test:
    name: Unit & Error Injection Tests (Coverage >= 75%)
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests with coverage gate (>= 75%)
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  validation-gate:
    name: Validation & Regression Gate (>= 75%, 0 Regressions)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Day 34 labeled set pipeline (20 frozen traces)
        run: python scripts/run_day34_validation.py

      - name: Evaluate Day 35 accuracy gate (fails CI if accuracy < 75%)
        run: python scripts/evaluate_day35_accuracy.py

      - name: Run Day 43 post-hardening regression gate (fails if accuracy < 75% or any previously-passing run fails)
        run: python scripts/run_day43_regression.py

      - name: Run Day 34, Day 35, Day 36 & Day 43 verification checks
        run: |
          python scripts/verify_day34.py
          python scripts/verify_day35.py
          python scripts/verify_day36.py
          python scripts/verify_day43.py

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            validation/results_day34.json
            validation/accuracy_day35.json
            validation/baseline_day35.json
            validation/regression_day43.json
            validation/ACCURACY_REPORT.md
            validation/REGRESSION_REPORT_DAY43.md
